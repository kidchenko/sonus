name: release

# One release, every package. A pushed v* tag fans out to a macOS, a Windows
# and a Linux runner — each builds its own native packages on its own OS, the
# thing you cannot do by cross-compiling — and a final job bundles them into a
# single GitHub Release. So every release carries Sonus.dmg, Sonus-Setup.exe
# and the Linux .deb, .rpm and .tar.gz without anyone building on three
# machines by hand.
#
# Push a tag to release:  git tag v0.1.0 && git push origin v0.1.0
# The tag must match [package].version in Cargo.toml.
#
# A manual run (Actions tab) is a dry run: it builds and packages everything
# and uploads it as run artifacts, but publishes nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; the one job that publishes asks for more.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          manifest="$(awk '/^\[/{p=($0=="[package]")} p&&/^version[[:space:]]*=/{split($0,a,"\"");print a[2];exit}' Cargo.toml)"
          [ -n "$manifest" ] || { echo "::error::no [package].version"; exit 1; }
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
            v="${BASH_REMATCH[1]}"
            if [ "$v" != "$manifest" ]; then
              echo "::error::tag v$v does not match Cargo.toml version $manifest"
              exit 1
            fi
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            v="$manifest"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build universal Sonus.app + DMG
        run: bash build.sh --universal --dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer + portable exe
        shell: pwsh
        run: .\build.ps1
      - name: Update Chocolatey and winget manifests
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          $sha = (Get-FileHash "dist\Sonus-Setup-$v.exe" -Algorithm SHA256).Hash
          $today = Get-Date -Format 'yyyy-MM-dd'
          # The version the files currently hold is discovered, not assumed.
          $stale = ([regex]'\d+\.\d+\.\d+').Match(
            (Get-Content packaging\choco\tools\chocolateyinstall.ps1 -Raw)).Value
          $pattern = [regex]::Escape($stale)

          (Get-Content packaging\choco\tools\chocolateyinstall.ps1) `
            -replace "checksum64(\s*)= '.*'", "checksum64`$1= '$sha'" -replace $pattern, $v |
            Set-Content packaging\choco\tools\chocolateyinstall.ps1
          Get-ChildItem packaging\winget\*.yaml | ForEach-Object {
            (Get-Content $_) -replace '^(\s*InstallerSha256:\s*).*$', "`${1}$sha" `
              -replace $pattern, $v -replace '^(ReleaseDate:\s*).*$', "`${1}$today" |
              Set-Content $_
          }
          choco pack packaging\choco\sonus.nuspec --version $v --outputdirectory dist
          if ($LASTEXITCODE -ne 0) { throw "choco pack failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.nupkg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-winget
          path: packaging/winget/*.yaml

  linux:
    needs: version
    # The oldest Ubuntu GitHub runs: the packages need the glibc they were
    # built against or newer, and this one's (2.35) is from 2022.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build and packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libayatana-appindicator3-dev libpulse-dev \
            dpkg-dev rpm file bc
      - name: Build .deb, .rpm and .tar.gz
        run: bash build.sh --package
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [version, macos, windows, linux]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{macos,windows,linux}"
          merge-multiple: true
      - name: Checksums
        # Only what gets attached to the release; the .nupkg goes to Chocolatey.
        run: |
          cd dist
          sha256sum -- *.dmg *.exe *.deb *.rpm *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          files=(dist/*.dmg dist/*.exe dist/*.deb dist/*.rpm dist/*.tar.gz dist/SHA256SUMS.txt)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "Sonus ${TAG#v}" --verify-tag --generate-notes
          fi

  # Optional: only runs when the CHOCO_API_KEY secret is set. New packages go
  # through community moderation, so the first push takes a while to appear.
  chocolatey:
    needs: [version, release]
    runs-on: windows-latest
    env:
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        if: env.CHOCO_API_KEY != ''
        with:
          name: windows
          path: dist
      - name: Push to community.chocolatey.org
        if: env.CHOCO_API_KEY != ''
        shell: pwsh
        run: |
          $pkg = Get-ChildItem dist\*.nupkg | Select-Object -First 1
          choco push $pkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY

  # Optional: only runs when the HOMEBREW_TAP_TOKEN secret is set (a token that
  # can run workflows on kidchenko/homebrew-tap). Without it, the tap's daily
  # bump picks the release up instead.
  homebrew:
    needs: [version, release]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Bump the cask in kidchenko/homebrew-tap
        if: env.GH_TOKEN != ''
        run: |
          # A new app's first release comes before its cask, which the tap's CI
          # can only install once there is a release to download.
          if ! gh api repos/kidchenko/homebrew-tap/contents/Casks/sonus.rb --silent 2>/dev/null; then
            echo "::notice::kidchenko/homebrew-tap has no sonus cask yet; add it, then the daily bump keeps it current"
            exit 0
          fi
          gh workflow run bump.yml --repo kidchenko/homebrew-tap -f cask=sonus

  # Optional: only runs when the WINGET_TOKEN secret is set (a classic token
  # with public_repo; the pull request to microsoft/winget-pkgs comes from that
  # account's fork). It can only add a version to a package that is already in
  # winget-pkgs, so the first version of each app was submitted by hand.
  winget:
    needs: [version, release]
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Open a pull request on microsoft/winget-pkgs
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: kidchenko.Sonus
          version: ${{ needs.version.outputs.version }}
          release-tag: ${{ github.ref_name }}
          installers-regex: '-Setup-[0-9.]+\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
